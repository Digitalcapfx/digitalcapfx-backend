            update
          schema:
            $ref: '#/definitions/handlers.Hub2RefResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Fund USDC account via Mobile Money
      tags:
      - CaaS - Stablecoin (USDC)
  /crypto/send:
    post:
      consumes:
      - application/json
      description: Transfers Stablecoin (USDC) from the caller to a recipient addressed
        by EITHER a phone number (`receiver_phone`) OR a raw 0x SCW wallet address
        (`recipient_address`) — provide exactly one. Settles on-chain as USDC between
        the two EIP-4337 wallets via Rach CaaS. A phone that was never provisioned
        is created on the fly and the recipient is notified by SMS; a wallet address
        must already exist (it cannot be auto-provisioned). Amount is USD-equivalent
        decimal (e.g. "50.00"). The `token` field selects the on-chain settlement
        asset (USDC/USDT); the customer-facing unit is USDC. This is the CaaS P2P
        rail, distinct from WaaS on-chain crypto transfers.
      parameters:
      - description: Transfer details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SendCryptoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CryptoTxResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
