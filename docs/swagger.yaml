  /admin/users/{id}/reprovision-fiat:
    post:
      description: 'Re-runs fiat account provisioning (Nilos EUR/GBP + Nomba NGN)
        for a verified user. Provisioning normally runs automatically the moment KYC
        is approved, but it is fire-and-forget with no automatic retry — so a provider
        failure at that instant leaves the customer without the bank account permanently.
        This endpoint lets an admin backfill or retry it (e.g. after a provider outage
        or a credentials fix) without the user re-doing KYC. It is idempotent — accounts
        already provisioned are skipped. Returns a per-currency status map, e.g. {"EUR":"provisioned","GBP":"error:
        nilos 403: Forbidden resource","NGN":"skipped: no BVN on file"}.'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Re-provision a user's fiat accounts (admin backfill/retry)
      tags:
      - admin-users
