basePath: /api/v1
definitions:
  db.ActivityItem:
    properties:
      amount:
        description: absolute decimal string
        type: string
      amount_sign:
        description: '"+" | "-"'
        type: string
      asset:
        description: '"BTC", "USD", "USDC", "ETH"'
        type: string
      counter_name:
        type: string
      created_at:
        type: string
      days_ago:
        type: integer
      description:
        description: '"Received BTC", "Sent USD", etc.'
        type: string
      id:
        type: string
      source:
        description: '"fiat" | "crypto" | "caas"'
        type: string
      status:
        description: '"completed" | "pending" | "failed"'
        type: string
      type:
        description: '"credit" | "debit" | "exchange"'
        type: string
    type: object
  db.AdminDepartment:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  db.BusinessProfile:
