  /notifications/devices:
    delete:
      consumes:
      - application/json
      description: Removes this device's FCM token so it stops receiving push. Call
        on logout, or when the user turns push off in settings. Only removes the token
        if it belongs to the authenticated user. Send the same `token` string that
        was registered.
      parameters:
      - description: FCM device token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unregister a device from push notifications
      tags:
      - notifications
    post:
      consumes:
      - application/json
      description: |-
        Registers this device's Firebase Cloud Messaging (FCM) registration token so the authenticated user receives push notifications. This is the ONLY setup call the mobile app needs — the backend handles all sending automatically (project digitalcap-fx-501314, FCM v1 / HTTP API; no legacy server key required on the client).

        **When to call:** (1) right after a successful login, (2) on every app start, and (3) whenever Firebase issues a new token via onTokenRefresh. It is idempotent — it upserts by token, and if a token previously belonged to another user it is reassigned to the current user. No need to unregister the old token first on refresh.

        **platform:** one of `ios`, `android`, `web` (omitted → stored as `unknown`).

        **What the device receives:** a standard FCM message = a `notification` block (`title`, `body`) for the system tray PLUS a `data` map for in-app routing. `data` ALWAYS contains `type` (the event), and event-specific extra keys. Route/deep-link on `data.type`. Known values: `login_detected`, `welcome`, `kyc_submitted`, `kyc_approved`, `kyc_rejected`, `transfer_sent`, `transfer_received`, `deposit_received`, `deposit_confirmed`, `withdrawal_processed`, `crypto_sent`, `crypto_received`, `exchange_completed`, `market_alert` (extra: `symbol`), `test`. CaaS stablecoin credits arrive as `type=deposit_confirmed` with `symbol=USDC`, `tx_hash`, `reference`, `source=caas`.

        **Token hygiene:** the server auto-prunes tokens that FCM reports as unregistered/invalid, so always re-register on token refresh to stay reachable. Call DELETE /notifications/devices on logout.
      parameters:
      - description: FCM device token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Register a device for push notifications
      tags:
      - notifications
  /notifications/read-all:
    patch:
      description: Marks every unread notification for the authenticated user as read.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Unauthorized
          schema:
