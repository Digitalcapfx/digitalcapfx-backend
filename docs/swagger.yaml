  /webhooks/caas:
    post:
      consumes:
      - application/json
      description: Receiver for Rach CaaS account/settlement events (funding, on-chain
        credit, P2P transfer, off-ramp). Follows the standard Rach webhook signing
        — header `X-Webhook-Signature` = hex HMAC-SHA256 of the raw request body,
        keyed with the CaaS webhook secret (CAAS_WEBHOOK_SECRET), which is SEPARATE
        from the WaaS secret. Verification also tolerates alternate header names and
        base64 as a hardening fallback. On a credit/deposit event the owning user
        (resolved by phone) is notified, always labeled USDC (name "Stablecoin").
        Always returns 200 on business-logic issues so the provider does not retry.
      parameters:
      - description: hex HMAC-SHA256(rawBody, CaaS secret)
        in: header
        name: X-Webhook-Signature
        required: true
        type: string
      - description: Webhook payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CaasWebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Rach CaaS Webhook (Stablecoin / USDC)
      tags:
      - webhooks
  /webhooks/hub2:
    post:
      consumes:
      - application/json
      description: Receives Mobile Money payment status updates from HUB2. On a COLLECTION
        SUCCESSFUL event, DigitalFX automatically credits the user's CaaS USDC wallet.
        The request must carry a valid HMAC-SHA256 signature in the X-Hub2-Signature
        header.
      parameters:
      - description: 'HMAC-SHA256 signature: sha256=<hex>'
        in: header
        name: X-Hub2-Signature
        required: true
        type: string
      - description: HUB2 webhook payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.HUB2WebhookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Invalid signature
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: HUB2 payment webhook
      tags:
      - webhooks
  /webhooks/kyc:
    post:
      consumes:
      - application/json
      description: Receives verification result events from Sumsub (e.g. `applicantReviewed`).
        Verified via HMAC over the raw request body using the Sumsub webhook secret
        — the digest is read from the `X-Payload-Digest` header and its algorithm
        from `X-Payload-Digest-Alg` (`HMAC_SHA1_HEX` | `HMAC_SHA256_HEX` | `HMAC_SHA512_HEX`;
        defaults to SHA-256). On a `GREEN` review the user is auto-approved; other
        results are rejected — unless an admin has taken manual control, which always
        wins (hybrid KYC). Always acknowledges with 200 to prevent provider retries.
      parameters:
      - description: HMAC digest (hex) of the raw request body
        in: header
        name: X-Payload-Digest
        required: true
        type: string
      - description: 'Digest algorithm: HMAC_SHA1_HEX | HMAC_SHA256_HEX | HMAC_SHA512_HEX
          (default SHA-256)'
        in: header
        name: X-Payload-Digest-Alg
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
      summary: KYC provider webhook (Sumsub)
      tags:
      - webhooks
  /webhooks/metamap:
    post:
      consumes:
      - application/json
      description: Receives verification result events from MetaMap. Updates KYC status
        to approved or rejected.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: MetaMap verification webhook
      tags:
      - webhooks
  /webhooks/nilos:
    post:
      consumes:
      - application/json
      description: Receiver for Nilos transaction events. An inbound, successful transaction
        credits the owning DigitalFX fiat account (resolved by the Nilos account id)
        — idempotently, keyed on the Nilos transaction id, so redelivery never double-credits.
        Signature is verified against NILOS_WEBHOOK_SECRET when set (the Nilos webhook
        scheme is confirmed on first delivery — mismatches log the headers). Returns
        200 on business-logic issues so Nilos does not retry; 401 only on signature
        mismatch.
      parameters:
      - description: Nilos webhook payload
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Nilos Webhook (fiat deposits)
      tags:
      - webhooks
  /webhooks/nomba:
    post:
      consumes:
      - application/json
      description: Receiver for Nomba account/transfer events. On `payment_success`
        (a virtual-account credit) the owning DigitalFX Naira account is credited
        by the alias account number and the customer is notified. Signature is verified
        against NOMBA_WEBHOOK_SECRET using the `nomba-signature` header (HmacSHA256
        of the documented field string). Payout events are logged. Returns 200 on
        business-logic issues so Nomba does not retry; 401 only on signature mismatch.
      parameters:
      - description: Base64 HMAC-SHA256 signature
        in: header
        name: nomba-signature
        type: string
      - description: 'Nomba webhook payload (event_type: payment_success | payment_failed
          | payment_reversal | payout_success | payout_failed | payout_refund)'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/nomba.WebhookEvent'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Nomba Webhook (NGN virtual accounts + payouts)
      tags:
      - webhooks
  /webhooks/payments:
    post:
      consumes:
      - application/json
      description: 'Receiver for Rach WaaS on-chain deposit events. Fires `wallet.deposit.detected`
        (seen on-chain, not credited) and `wallet.deposit.confirmed` (block-depth/settlement
        threshold met). On a confirmed event the owning user (resolved by derived
        address) is notified and the deposit is mirrored best-effort into their local
        ledger; the WaaS balance API remains authoritative. Signature: header `X-Webhook-Signature`
        = hex HMAC-SHA256 of the raw request body, keyed with the WaaS webhook secret
        (PAYMENTS_WEBHOOK_SECRET). Always returns 200 on business-logic issues to
        avoid provider retries.'
      parameters:
      - description: hex HMAC-SHA256(rawBody, secret)
        in: header
        name: X-Webhook-Signature
        required: true
        type: string
      - description: Event name (e.g. wallet.deposit)
        in: header
        name: X-Webhook-Event
        type: string
      - description: Webhook payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PaymentsWebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Rach WaaS Webhook (crypto deposits)
      tags:
      - webhooks
  /withdrawals:
    get:
      description: Returns a paginated list of the caller's fiat withdrawal requests.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Results per page, max 50 (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WithdrawalListResponse'
      security:
      - BearerAuth: []
      summary: List fiat withdrawals
      tags:
      - Fiat - Nilos
    post:
      consumes:
      - application/json
      description: 'Initiates a withdrawal from the user''s fiat account to a mobile
        money number (XAF/XOF via HUB2) or an external bank account. Bank payouts
        route by currency: EUR/GBP settle via Nilos (SEPA/SWIFT/FPS); NGN settles
        via Nomba. For an NGN transfer set source_currency "NGN" and provide account_number
        + bank_code (get bank_code from GET /nomba/banks, and verify the holder name
        first via GET /nomba/resolve-account). The business FX rate is applied for
        cross-currency withdrawals. Status starts as "processing".'
      parameters:
      - description: Withdrawal request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.InitiateWithdrawalRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.FiatWithdrawalResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Insufficient balance
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Initiate fiat withdrawal
      tags:
      - Fiat - Nilos
  /withdrawals/{id}:
    get:
      parameters:
      - description: Withdrawal UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.FiatWithdrawalResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a fiat withdrawal by ID
      tags:
      - Fiat - Nilos
  /withdrawals/beneficiaries:
    get:
      description: Returns all saved withdrawal destinations (banks and mobile money
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.BeneficiaryResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List saved beneficiaries
      tags:
      - Fiat - Nilos
    post:
      consumes:
      - application/json
      description: Saves a bank account or mobile money number for quick repeat
      parameters:
      - description: Beneficiary
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SaveBeneficiaryRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.BeneficiaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Save a new beneficiary
      tags:
      - Fiat - Nilos
  /withdrawals/beneficiaries/{id}:
    delete:
      parameters:
      - description: Beneficiary UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a saved beneficiary
      tags:
      - Fiat - Nilos
  /withdrawals/quote:
    post:
      consumes:
      - application/json
      description: Returns the exact fee and destination amount for a withdrawal
      parameters:
      - description: Quote request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.WithdrawalQuoteRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WithdrawalQuoteData'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preview fiat withdrawal
      tags:
      - Fiat - Nilos
securityDefinitions:
  BearerAuth:
    description: 'JWT access token — prefix with "Bearer ": Bearer eyJhbGci...'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
