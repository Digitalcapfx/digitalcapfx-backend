      network:
        description: '"BTC" "ETH" etc.'
        type: string
      provider:
        description: '"caas" | "waas" | "hub2" | "nilos"'
        type: string
      provider_balance:
        description: |-
          ProviderBalance is the authoritative live balance held at the provider
          (Nilos for EUR/GBP/…) for verification/reconciliation against the ledger
          `balance`. Nil when not applicable (e.g. NGN — Nomba has no per-account
          balance) or when the provider read failed.
        type: number
      symbol:
        type: string
      type:
        description: '"fiat" | "stablecoin" | "crypto"'
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: engineering@rach.finance
    name: Rach Finance Engineering
  description: |-
    DigitalFX is a multi-currency fintech platform for Central/West Africa.
    It combines fiat accounts (XAF, XOF, USD, GBP, EUR), HD crypto wallets (BIP-44 via Rach WaaS),
    and stablecoin P2P transfers (USDC/USDT via Rach CaaS ERC-4337 SCWs).
    Mobile Money deposits and withdrawals are handled via HUB2 (MTN, Orange).
  title: DigitalFX API
  version: "1.0"
paths:
  /account/limits:
    get:
      description: Returns the caller's tier limits (individual vs business) and current
        24h withdrawal usage.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AccountLimitsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account limits and usage
      tags:
      - account
  /accounts:
    get:
      description: Returns all fiat accounts (XAF, XOF, USD, GBP, EUR) for the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AccountListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
  /accounts/{currency}:
    get:
      description: Returns a single fiat account for the given currency code.
      parameters:
      - description: Currency code
        enum:
        - XAF
        - XOF
        - USD
        - GBP
        - EUR
        in: path
        name: currency
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AccountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account by currency
      tags:
      - accounts
  /accounts/{currency}/transactions:
    get:
      description: Returns a paginated list of transactions for the given currency
        account.
      parameters:
      - description: Currency code
        enum:
        - XAF
        - XOF
        - USD
        - GBP
        - EUR
        in: path
        name: currency
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Results per page, max 100 (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TransactionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List transactions for an account
      tags:
      - accounts
  /accounts/{currency}/transactions/{id}:
    get:
      description: Returns a specific transaction by its UUID.
      parameters:
      - description: Currency code
        enum:
        - XAF
        - XOF
        - USD
        - GBP
        - EUR
        in: path
        name: currency
        required: true
        type: string
      - description: Transaction UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TransactionResponse'
        "400":
          description: Invalid UUID
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a single transaction
      tags:
      - accounts
  /activity:
    get:
      description: Unified, filterable transaction feed across all wallet types (fiat,
        crypto, stablecoin). Results are grouped by calendar day (Today / Yesterday
        / Monday / …). Supports a type filter tab and full-text search.
      parameters:
      - description: Filter
        enum:
        - sent
        - received
        - exchanged
        - deposited
        - withdrawn
        in: query
        name: type
        type: string
      - description: Search description, asset, or counterparty
        in: query
        name: search
        type: string
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Results per page (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Activity feed
      tags:
      - activity
  /admin/audit-log:
    get:
      description: Returns paginated log of all admin actions (KYC decisions, user
        disables, staff changes, FX rate updates). Filterable by staff member, resource
        type, or specific resource ID.
      parameters:
      - description: Filter by staff member ID
        in: query
        name: staff_id
        type: string
      - description: Filter by resource type (kyc, user, staff, withdrawal_rate)
        in: query
        name: resource
        type: string
      - description: Filter by specific resource ID
        in: query
        name: resource_id
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Results per page (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin audit trail
      tags:
      - admin-staff
  /admin/currency-rates:
    get:
      description: Admin view of all currency buy/sell/standard rates. Requires the
        rates:view permission.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.CurrencyRate'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List currency rates (admin)
      tags:
      - admin
  /admin/currency-rates/{currency}:
    put:
      consumes:
      - application/json
      description: Creates or updates the standard, buy and sell rate for a currency.
        Buy low / sell high for margin; standard is the display rate. Requires the
        rates:manage permission.
      parameters:
      - description: Currency code (USD, EUR, GBP, XAF, XOF, NGN)
        in: path
        name: currency
        required: true
        type: string
      - description: Standard / buy / sell rates (per 1 USD)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SetCurrencyRateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/db.CurrencyRate'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set a currency's rates (admin)
      tags:
      - admin
  /admin/dashboard:
    get:
      description: 'Returns aggregate platform stats: total/active/disabled users,
        KYC pipeline counts, transaction volume (30d), new user growth (7d / 30d),
        and active staff count.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin dashboard statistics
      tags:
      - admin-users
  /admin/departments:
    get:
      description: Returns all admin team departments with the number of staff assigned
        to each.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List departments
      tags:
      - admin-departments
    post:
      consumes:
      - application/json
      parameters:
      - description: Department
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.DepartmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/db.AdminDepartment'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a department
      tags:
      - admin-departments
  /admin/departments/{id}:
    delete:
      description: Deletes a department. Fails if staff are still assigned to it —
        reassign them first.
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
