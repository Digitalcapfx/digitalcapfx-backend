  /crypto/fund:
    post:
      consumes:
      - application/json
      description: 'Funds the customer''s Stablecoin (USDC) account. Initiates a HUB2
        Mobile Money collection: the customer receives a push-to-pay prompt on their
        phone. After they approve, HUB2 fires a webhook which triggers Rach CaaS to
        convert the XOF/XAF to on-chain USDC and credit the customer''s EIP-4337 Smart
        Contract Wallet — reflected to the customer as USDC. Poll GET /crypto/balances
        for the updated USDC balance once CaaS confirms the fiat and completes the
        conversion.'
      parameters:
      - description: Funding request
        in: body
        name: body
        required: true
