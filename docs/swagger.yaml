  /admin/reconciliation/nomba:
    get:
      description: Compares the Nomba merchant (parent) wallet NGN balance against
        the sum of all customers' NGN ledger balances. A non-zero `difference` flags
        drift. Nomba virtual accounts are collection aliases (no per-customer balance
        at Nomba), so per-customer NGN balances live in our ledger — this is the aggregate
        check.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.NombaReconciliation'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: NGN treasury reconciliation (Nomba)
      tags:
      - admin
