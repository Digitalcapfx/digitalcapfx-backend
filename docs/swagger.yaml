          $ref: '#/definitions/nomba.Bank'
        type: array
    type: object
  handlers.NombaResolveAccountResponse:
    properties:
      account_name:
        type: string
      account_number:
        type: string
    type: object
  handlers.PaginationMeta:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 20
        type: integer
      total:
        example: 100
        type: integer
      total_pages:
        example: 5
        type: integer
    type: object
  handlers.PayBillRequest:
    properties:
      account_number:
        example: "20019283"
        type: string
      amount:
        example: 5000
        type: number
      biller_id:
        example: ENEO
        type: string
      currency:
        enum:
        - XAF
        - XOF
        example: XAF
        type: string
    type: object
  handlers.PaymentsWebhookData:
    properties:
      address:
        type: string
      amount:
        type: string
      confirmations:
        type: integer
      confirmed_at:
        type: string
      currency:
        type: string
      customer_id:
        type: string
      detected_at:
        type: string
      network:
        type: string
      safe_to_credit:
        type: boolean
      status:
        type: string
      tx_hash:
        type: string
    type: object
  handlers.PaymentsWebhookPayload:
    properties:
      data:
        $ref: '#/definitions/handlers.PaymentsWebhookData'
      event:
        type: string
    type: object
  handlers.ProfileData:
    properties:
      avatar_url:
        type: string
      bio:
        example: Digital finance enthusiast from Cameroon
