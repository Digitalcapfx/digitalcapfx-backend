        the customer submitted in the intake form (identity + address + AML; for business,
        importer flag + top counterparties + contact), their uploaded documents (the
        Nilos KYB set for business), and the company profile for business accounts.
        Use before POST /admin/kyc/{id}/approve or /reject.'
